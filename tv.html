<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel TV | Águia Conecta</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            background-color: #001529; 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            overflow: hidden;
            height: 100vh;
        }
        .tv-header {
            background: #002855;
            padding: 15px 30px;
            border-bottom: 4px solid #00146b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-logo {
            height: 60px; /* Ajuste a altura da logo conforme necessário */
            width: auto;
        }
        .grid-chamados {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
            padding: 20px;
            height: calc(100vh - 100px); /* Otimiza espaço vertical */
            overflow-y: auto; /* Permite rolagem se houver muitos chamados */
        }
        .card-tv {
            background: #003366;
            border-radius: 15px;
            padding: 25px;
            border: 2px solid #00509d;
            transition: all 0.5s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        /* Efeito de Piscado Vermelho para Emergência */
        .urgente {
            animation: flash-red 1s infinite;
            border: 5px solid #ff0000 !important;
        }
        @keyframes flash-red {
            0% { background-color: #003366; }
            50% { background-color: #8b0000; }
            100% { background-color: #003366; }
        }
        .bus-number-display {
            font-size: 5rem; /* Número bem grande */
            font-weight: 900;
            color: #ffffff;
            line-height: 1;
            margin: 15px 0;
        }
        .placa-badge {
            background: white;
            color: black;
            padding: 5px 15px;
            border-radius: 5px;
            font-weight: bold;
            font-family: monospace;
            font-size: 1.2rem;
        }
        .problema-title {
            font-size: 2rem;
            font-weight: bold;
        }
        .clock {
            font-size: 1.5rem;
            font-weight: bold;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="tv-header">
        <div class="d-flex align-items-center">
            <img src="logo.png" alt="Águia Conecta" class="header-logo me-3">
            <div>
                <h1 class="mb-0 fw-bold" style="color: #ffffff;">ÁGUIA CONECTA</h1>
                <span class="text-uppercase small" style="opacity: 0.8;">Painel de Monitoramento de Manutenção</span>
            </div>
        </div>
        <div class="text-end">
            <div id="relogio" class="clock">00:00:00</div>
            <div class="d-flex align-items-center justify-content-end mt-1">
                <i class="fas fa-circle text-success me-2" style="font-size: 10px;"></i>
                <span class="badge bg-success text-uppercase">Online</span>
            </div>
        </div>
    </div>

    <div id="container-chamados" class="grid-chamados">
        </div>

    <audio id="alarme-sonoro" loop>
        <source src="https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3" type="audio/mpeg">
    </audio>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        // Configuração do seu Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCse0N51grAeI3fHrFFP9Azo-hC9kIQ7qY",
            authDomain: "translog-231da.firebaseapp.com",
            projectId: "translog-231da",
            storageBucket: "translog-231da.appspot.com",
            messagingSenderId: "306116251077",
            appId: "1:306116251077:web:cf9e590b7a14b5ff540fac",
            databaseURL: "https://translog-231da-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const somAlarme = document.getElementById('alarme-sonoro');
        let somLiberado = false;

        // Atualiza o relógio no cabeçalho
        setInterval(() => {
            document.getElementById('relogio').innerText = new Date().toLocaleTimeString();
        }, 1000);

        // Escuta os chamados no Firebase em tempo real
        db.ref('chamados').on('value', snapshot => {
            const container = document.getElementById('container-chamados');
            container.innerHTML = "";
            let temUrgente = false;

            snapshot.forEach(child => {
                const c = child.val();
                
                // Mostra chamados que não estão resolvidos
                if(c.status !== 'Resolvido') {
                    // Considera urgente se estiver no passo 1 (Recebido)
                    const isPendente = (c.status_passo === 1);
                    if(isPendente) temUrgente = true;

                    // Cria o card focado nas informações principais
                    const html = `
                        <div class="card-tv ${isPendente ? 'urgente' : ''}">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="badge bg-warning text-dark fw-bold">PROT: ${c.protocolo}</span>
                                <span class="placa-badge">${c.placa}</span>
                            </div>
                            <div class="text-center flex-grow-1 d-flex flex-column justify-content-center">
                                <div class="small text-uppercase" style="opacity: 0.7;">Ônibus</div>
                                <div class="bus-number-display">${c.numero}</div>
                                <div class="problema-title text-danger">${c.problema}</div>
                            </div>
                            <div class="border-top pt-3 mt-3 d-flex justify-content-between small" style="opacity: 0.8;">
                                <span><i class="fas fa-user me-1"></i> ${c.motorista}</span>
                                <span><i class="fas fa-map-marker-alt me-1"></i> ${c.local}</span>
                            </div>
                        </div>
                    `;
                    container.innerHTML += html;
                }
            });

            // Lógica do Som de Alerta
            if(temUrgente && somLiberado) {
                somAlarme.play().catch(e => console.log("Erro ao tocar som:", e));
                
                // Para o som automaticamente após 2 minutos (120000ms)
                setTimeout(() => {
                    pararSom();
                }, 120000); 
            } else {
                pararSom();
            }

            // Mensagem caso não haja ocorrências
            if(container.innerHTML === "") {
                container.innerHTML = `
                    <div class='text-center w-100 mt-5 opacity-50 d-flex flex-column align-items-center'>
                        <i class="fas fa-check-circle text-success mb-3" style="font-size: 4rem;"></i>
                        <h3>TUDO LIMPO</h3>
                        <p>Nenhuma ocorrência ativa no momento.</p>
                    </div>`;
            }
        });

        function pararSom() {
            somAlarme.pause();
            somAlarme.currentTime = 0;
        }

        // Navegadores bloqueiam som automático. É necessário um clique na tela para liberar.
        document.body.addEventListener('click', () => {
            somLiberado = true;
            console.log("Sistema de áudio liberado.");
            // Exibe um feedback visual rápido
            document.getElementById('status-db').innerText = "ÁUDIO OK";
            setTimeout(() => document.getElementById('status-db').innerText = "ONLINE", 2000);
        }, {once: true}); // Executa apenas uma vez

    </script>
</body>
</html>
