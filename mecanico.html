<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Mecânico | Águia Conecta</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .header-mec { background: #002855; color: white; padding: 15px 0; border-radius: 0 0 15px 15px; margin-bottom: 20px; }
        .card-chamado { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; background: white; }
        .card-chamado.atendendo { border-left: 8px solid #ffc107; background: #fffdf5; }
        .btn-atender { background-color: #28a745; color: white; font-weight: bold; border-radius: 8px; border: none; padding: 10px; }
        .btn-finalizar { background-color: #002855; color: white; font-weight: bold; border-radius: 8px; border: none; padding: 10px; }
        .img-preview { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; cursor: pointer; }
        .badge-pendente { background-color: #dc3545; color: white; }
        .badge-caminho { background-color: #ffc107; color: #000; }
    </style>
</head>
<body>

<div class="header-mec shadow">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h4 class="mb-0" id="nomeMec">Mecânico Operacional</h4>
            <small id="baseMec"><i class="fas fa-tools"></i> Águia Conecta</small>
        </div>
        <button onclick="logout()" class="btn btn-outline-light btn-sm">Sair</button>
    </div>
</div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">Chamados em Aberto</h5>
        <span id="contador" class="badge bg-dark">0</span>
    </div>
    
    <div id="listaChamadosMec">
        <div class="text-center py-5">
            <div class="spinner-border text-primary"></div>
            <p class="mt-2 text-muted">Sincronizando com a base...</p>
        </div>
    </div>
</div>

<div class="modal fade" id="modalFinalizar" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header"><h5>Finalizar Atendimento</h5></div>
            <div class="modal-body">
                <label class="small fw-bold mb-1">Relatório Técnico:</label>
                <textarea id="relatorioFinal" class="form-control" rows="4" placeholder="O que foi consertado no veículo?"></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" onclick="confirmarFinalizacao()" class="btn btn-success px-4">Concluir</button>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCse0N51grAeI3fHrFFP9Azo-hC9kIQ7qY",
        authDomain: "translog-231da.firebaseapp.com",
        projectId: "translog-231da",
        storageBucket: "translog-231da.appspot.com",
        messagingSenderId: "306116251077",
        appId: "1:306116251077:web:cf9e590b7a14b5ff540fac",
        databaseURL: "https://translog-231da-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Dados do Usuário (Se não tiver login, usa um padrão para não travar)
    const user = JSON.parse(localStorage.getItem('usuarioLogado')) || { nome: "Mecânico Geral", base: "Base Central", tipo: "mecanico" };
    document.getElementById('nomeMec').innerText = user.nome;
    document.getElementById('baseMec').innerHTML = `<i class="fas fa-map-marker-alt"></i> ${user.base}`;

    let idChamadoParaFinalizar = null;

    // ESCUTA EM TEMPO REAL
    db.ref('chamados').on('value', snapshot => {
        const lista = document.getElementById('listaChamadosMec');
        let html = "";
        let count = 0;

        snapshot.forEach(child => {
            const c = child.val();
            
            // FILTRO: Mostra '🚨 Pendente' (que o motorista envia) e 'Socorro a Caminho'
            if(c.status !== 'Resolvido') {
                count++;
                const atendendoEste = c.resposta_base === user.nome;
                const statusClass = c.status === '🚨 Pendente' ? 'badge-pendente' : 'badge-caminho';

                html += `
                <div class="card card-chamado ${atendendoEste ? 'atendendo' : ''} p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="fw-bold" style="font-size: 1.1rem; color: #002855;">🚌 Carro: ${c.numero}</span>
                        <span class="badge ${statusClass} p-2">${c.status}</span>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-7">
                            <p class="mb-1"><b>Problema:</b> <span class="text-danger">${c.problema}</span></p>
                            <p class="mb-1 small"><b>Motorista:</b> ${c.motorista}</p>
                            <p class="mb-0 small text-muted"><b>Local:</b> ${c.ponto_referencia}</p>
                        </div>
                        <div class="col-5 text-end">
                            ${c.foto ? `<img src="${c.foto}" class="img-preview shadow-sm" onclick="window.open('${c.foto}')">` : `<div class="bg-light text-muted small p-3 rounded">Sem foto</div>`}
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <a href="https://www.google.com/maps?q=${c.lat},${c.lng}" target="_blank" class="btn btn-outline-primary btn-sm flex-fill">
                            <i class="fas fa-location-arrow"></i> Ver GPS
                        </a>
                        
                        ${c.status === '🚨 Pendente' ? 
                            `<button onclick="atenderChamado('${child.key}')" class="btn btn-atender flex-fill">ASSUMIR</button>` : 
                            (atendendoEste ? 
                                `<button onclick="abrirModalFinalizar('${child.key}')" class="btn btn-finalizar flex-fill">FINALIZAR</button>` : 
                                `<button class="btn btn-light btn-sm flex-fill" disabled>Em atendimento</button>`)
                        }
                    </div>
                </div>`;
            }
        });

        document.getElementById('contador').innerText = count;
        lista.innerHTML = count > 0 ? html : '<div class="text-center text-muted mt-5">Tudo limpo! Nenhum chamado.</div>';
    });

    function atenderChamado(id) {
        if(confirm("Confirmar deslocamento para este socorro?")) {
            db.ref('chamados/' + id).update({
                status: 'Socorro a Caminho',
                resposta_base: user.nome,
                resposta_previsao: "30" // Valor padrão de exemplo
            });
        }
    }

    function abrirModalFinalizar(id) {
        idChamadoParaFinalizar = id;
        new bootstrap.Modal(document.getElementById('modalFinalizar')).show();
    }

    async function confirmarFinalizacao() {
        const relatorio = document.getElementById('relatorioFinal').value;
        if(!relatorio) return alert("Descreva o que foi feito no veículo.");

        try {
            const snap = await db.ref('chamados/' + idChamadoParaFinalizar).once('value');
            const dados = snap.val();

            // 1. Atualiza o chamado
            await db.ref('chamados/' + idChamadoParaFinalizar).update({
                status: 'Resolvido',
                resposta_obs: relatorio,
                hora_conclusao: new Date().toLocaleTimeString()
            });

            // 2. Libera o ônibus na frota
            await db.ref('frota/' + dados.numero).update({ status: 'Disponível' });

            bootstrap.Modal.getInstance(document.getElementById('modalFinalizar')).hide();
            document.getElementById('relatorioFinal').value = "";
            alert("Veículo liberado com sucesso!");
        } catch (err) {
            alert("Erro ao finalizar.");
        }
    }

    function logout() {
        localStorage.removeItem('usuarioLogado');
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
