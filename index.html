<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Águia Conecta</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #003366 0%, #00509d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
        }

        /* ── Card principal ── */
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 24px;
            background: white;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);

            /* Animação de entrada */
            opacity: 0;
            transform: translateY(30px) scale(0.97);
            animation: cardEntrada 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s forwards;
        }

        @keyframes cardEntrada {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Logo ── */
        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-img {
            width: 110px;
            height: 110px;
            border-radius: 24px;
            object-fit: cover;
            box-shadow: 0 8px 24px rgba(0,51,102,0.25);

            opacity: 0;
            transform: scale(0.7);
            animation: logoEntrada 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.35s forwards;
        }

        @keyframes logoEntrada {
            to { opacity: 1; transform: scale(1); }
        }

        .logo-area h3 {
            opacity: 0;
            transform: translateY(8px);
            animation: fadeUp 0.4s ease 0.6s forwards;
        }

        .logo-area p {
            opacity: 0;
            transform: translateY(8px);
            animation: fadeUp 0.4s ease 0.75s forwards;
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Input ── */
        .input-wrap {
            opacity: 0;
            transform: translateY(10px);
            animation: fadeUp 0.4s ease 0.85s forwards;
        }

        .form-control-lg {
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            transition: border-color 0.25s, box-shadow 0.25s;
            font-size: 1rem;
        }

        .form-control-lg:focus {
            border-color: #003366;
            box-shadow: 0 0 0 4px rgba(0,51,102,0.12);
            outline: none;
        }

        /* ── Botão ── */
        .btn-wrap {
            opacity: 0;
            transform: translateY(10px);
            animation: fadeUp 0.4s ease 0.95s forwards;
        }

        .btn-login {
            background-color: #003366;
            border: none;
            padding: 14px;
            font-weight: bold;
            border-radius: 12px;
            font-size: 1rem;
            letter-spacing: 0.5px;
            transition: background-color 0.25s, transform 0.15s, box-shadow 0.25s;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover:not(:disabled) {
            background-color: #00509d;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,51,102,0.35);
        }

        .btn-login:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-login:disabled {
            opacity: 0.85;
            cursor: not-allowed;
        }

        /* ── Ripple ── */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
            width: 10px;
            height: 10px;
            margin-top: -5px;
            margin-left: -5px;
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to { transform: scale(40); opacity: 0; }
        }

        /* ── Rodapé ── */
        .footer-txt {
            opacity: 0;
            animation: fadeUp 0.4s ease 1.1s forwards;
        }

        /* ── Partículas de fundo ── */
        .bg-particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0%   { transform: translateY(100vh) scale(0); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        .login-card { position: relative; z-index: 1; }
    </style>
</head>
<body>

    <!-- Partículas de fundo -->
    <div class="bg-particles" id="particles"></div>

    <div class="login-card">
        <div class="logo-area">
            <img src="logo.png" alt="Águia Conecta" class="logo-img">
            <h3 class="mt-3 fw-bold" style="color: #003366;">Águia Conecta</h3>
            <p class="text-muted small mb-0">Gerenciamento de Contingência</p>
        </div>

        <div class="input-wrap mb-3">
            <label class="form-label fw-bold"><i class="fas fa-id-card me-2"></i>Acesso do Usuário</label>
            <input type="text" id="usuario" class="form-control form-control-lg text-center"
                   placeholder="Matrícula ou CPF" autofocus>
        </div>

        <div class="btn-wrap">
            <button onclick="fazerLogin(event)" id="btnEntrar" class="btn btn-primary btn-login w-100 mb-3">
                ENTRAR NO SISTEMA
            </button>
        </div>

        <div class="footer-txt text-center">
            <small class="text-muted">Motoristas e Mecânicos: Matrícula ou CPF</small>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        // ─── PARTÍCULAS DE FUNDO ─────────────────────────────────────
        const container = document.getElementById('particles');
        for (let i = 0; i < 18; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 60 + 20;
            p.style.cssText = `
                width: ${size}px;
                height: ${size}px;
                left: ${Math.random() * 100}%;
                animation-duration: ${Math.random() * 15 + 10}s;
                animation-delay: ${Math.random() * 10}s;
            `;
            container.appendChild(p);
        }

        // ─── RIPPLE NO BOTÃO ─────────────────────────────────────────
        function addRipple(e, btn) {
            const r = document.createElement('span');
            r.className = 'ripple';
            const rect = btn.getBoundingClientRect();
            r.style.left = (e.clientX - rect.left) + 'px';
            r.style.top  = (e.clientY - rect.top)  + 'px';
            btn.appendChild(r);
            setTimeout(() => r.remove(), 700);
        }

        // ─── FIREBASE ────────────────────────────────────────────────
        firebase.initializeApp({
            apiKey: "AIzaSyCse0N51grAeI3fHrFFP9Azo-hC9kIQ7qY",
            authDomain: "translog-231da.firebaseapp.com",
            projectId: "translog-231da",
            storageBucket: "translog-231da.firebasestorage.app",
            messagingSenderId: "306116251077",
            appId: "1:306116251077:web:cf9e590b7a14b5ff540fac",
            databaseURL: "https://translog-231da-default-rtdb.firebaseio.com/"
        });
        const db = firebase.database();

        // ─── LOGIN ───────────────────────────────────────────────────
        async function fazerLogin(e) {
            const btn = document.getElementById('btnEntrar');
            addRipple(e, btn);

            const inputRaw   = document.getElementById('usuario').value.trim();
            const inputLower = inputRaw.toLowerCase();
            const inputClean = inputRaw.replace(/\D/g, "");

            if (!inputRaw) return alert("Por favor, digite seu acesso.");

            // Acesso TV
            if (inputLower === 'painel.tv') { window.location.href = 'tv.html'; return; }

            // Acesso Central
            if (inputLower === '268426') { window.location.href = 'central.html'; return; }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Autenticando...';

            try {
                // Busca motoristas
                const snapMotoristas = await db.ref('motoristas').once('value');
                let motoristaEncontrado = null;
                snapMotoristas.forEach(child => {
                    const m = child.val();
                    if (m.matricula === inputRaw || m.cpf === inputClean) motoristaEncontrado = m;
                });

                if (motoristaEncontrado) {
                    btn.innerHTML = '<i class="fas fa-check me-2"></i>Bem-vindo!';
                    btn.style.backgroundColor = '#198754';
                    localStorage.setItem('usuarioLogado', JSON.stringify({
                        nome: motoristaEncontrado.nome,
                        matricula: motoristaEncontrado.matricula,
                        tipo: 'motorista'
                    }));
                    setTimeout(() => window.location.href = 'motorista.html', 600);
                    return;
                }

                // Busca mecânicos
                const snapMecanicos = await db.ref('cadastro_mecanicos').once('value');
                let mecanicoEncontrado = null;
                snapMecanicos.forEach(child => {
                    const mec = child.val();
                    if (mec.matricula === inputRaw || mec.cpf === inputClean) mecanicoEncontrado = mec;
                });

                if (mecanicoEncontrado) {
                    const snapVinculo = await db.ref('vinculos_equipe/' + mecanicoEncontrado.matricula).once('value');
                    if (snapVinculo.exists()) {
                        btn.innerHTML = '<i class="fas fa-check me-2"></i>Bem-vindo!';
                        btn.style.backgroundColor = '#198754';
                        localStorage.setItem('usuarioLogado', JSON.stringify({
                            nome: mecanicoEncontrado.nome,
                            matricula: mecanicoEncontrado.matricula,
                            base: snapVinculo.val().baseNome,
                            tipo: 'mecanico'
                        }));
                        setTimeout(() => window.location.href = 'mecanico.html', 600);
                    } else {
                        alert('⚠️ Você está cadastrado, mas não possui uma BASE vinculada.');
                        resetBtn(btn);
                    }
                    return;
                }

                alert('❌ Usuário não localizado!');
                resetBtn(btn);

            } catch (error) {
                console.error(error);
                alert("Erro ao conectar com o servidor.");
                resetBtn(btn);
            }
        }

        function resetBtn(btn) {
            btn.disabled = false;
            btn.style.backgroundColor = '';
            btn.innerText = 'ENTRAR NO SISTEMA';
        }

        document.getElementById('usuario').addEventListener('keypress', e => {
            if (e.key === 'Enter') fazerLogin(e);
        });
    </script>
</body>
</html>
